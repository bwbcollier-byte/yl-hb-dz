name: Deezer Unified Enrichment

on:
  # Schedule disabled 2026-05-20 — migrated to Supabase Edge Function (deezer-enrichment).
  # Now runs via pg_cron job_id 248 (social, */5 min) + 249 (media, 2-59/5 min) using JSONB schema
  # (enrichment_ids.deezer, audio_metrics.deezer_fans) + new check_deezer_enrichment column.
  # Workflow YAML retained with workflow_dispatch as belt-and-braces fallback if Edge Function fails.
  # See Work/Engineering Ops/deezer-edge-fn/ and decisions.md 2026-05-20.
  workflow_dispatch:
    inputs:
      record_limit:
        description: 'Number of records to process (leave empty for all)'
        required: false
        default: ''
        type: string


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  media-enrichment:
    name: Media Profile Enrichment
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Notify Supabase — start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/log_workflow_run" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_workflow_id": 248654851, "p_status": "running", "p_run_id": "${{ github.run_id }}"}'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Deezer Media Enrichment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RAPIDAPI_KEY_1: ${{ secrets.RAPIDAPI_KEY_1 }}
          RAPIDAPI_KEY_2: ${{ secrets.RAPIDAPI_KEY_2 }}
          RAPIDAPI_KEY_3: ${{ secrets.RAPIDAPI_KEY_3 }}
          RAPIDAPI_KEY_4: ${{ secrets.RAPIDAPI_KEY_4 }}
          RAPIDAPI_KEY_5: ${{ secrets.RAPIDAPI_KEY_5 }}
          RAPIDAPI_KEY_6: ${{ secrets.RAPIDAPI_KEY_6 }}
          RAPIDAPI_KEY_7: ${{ secrets.RAPIDAPI_KEY_7 }}
          RAPIDAPI_KEY_8: ${{ secrets.RAPIDAPI_KEY_8 }}
          RAPIDAPI_KEY_9: ${{ secrets.RAPIDAPI_KEY_9 }}
          RAPIDAPI_KEY_10: ${{ secrets.RAPIDAPI_KEY_10 }}
          LIMIT: ${{ github.event.inputs.record_limit }}
          CI: 'true'
        run: node dist/deezer-media-enrichment.js

      - name: Notify Supabase — result
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DURATION=$(( $(date +%s) - START_TIME ))
          STATUS="${{ job.status }}"
          PAYLOAD=$(printf '{"p_workflow_id": 248654851, "p_status": "%s", "p_duration_secs": %s, "p_run_id": "${{ github.run_id }}"}' "$STATUS" "$DURATION")
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/log_workflow_run" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  social-enrichment:
    name: Social Profile Enrichment
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Notify Supabase — start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/log_workflow_run" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_workflow_id": 248654851, "p_status": "running", "p_run_id": "${{ github.run_id }}"}'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Deezer Social Enrichment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RAPIDAPI_KEY_1: ${{ secrets.RAPIDAPI_KEY_1 }}
          RAPIDAPI_KEY_2: ${{ secrets.RAPIDAPI_KEY_2 }}
          RAPIDAPI_KEY_3: ${{ secrets.RAPIDAPI_KEY_3 }}
          RAPIDAPI_KEY_4: ${{ secrets.RAPIDAPI_KEY_4 }}
          RAPIDAPI_KEY_5: ${{ secrets.RAPIDAPI_KEY_5 }}
          RAPIDAPI_KEY_6: ${{ secrets.RAPIDAPI_KEY_6 }}
          RAPIDAPI_KEY_7: ${{ secrets.RAPIDAPI_KEY_7 }}
          RAPIDAPI_KEY_8: ${{ secrets.RAPIDAPI_KEY_8 }}
          RAPIDAPI_KEY_9: ${{ secrets.RAPIDAPI_KEY_9 }}
          RAPIDAPI_KEY_10: ${{ secrets.RAPIDAPI_KEY_10 }}
          LIMIT: ${{ github.event.inputs.record_limit }}
          CI: 'true'
        run: node dist/deezer-social-enrichment.js

      - name: Notify Supabase — result
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DURATION=$(( $(date +%s) - START_TIME ))
          STATUS="${{ job.status }}"
          PAYLOAD=$(printf '{"p_workflow_id": 248654851, "p_status": "%s", "p_duration_secs": %s, "p_run_id": "${{ github.run_id }}"}' "$STATUS" "$DURATION")
          curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/log_workflow_run" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
